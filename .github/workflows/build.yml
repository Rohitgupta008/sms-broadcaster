name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GST-Reminder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GST-Reminder-apk
          path: GST-Reminder.apk
      # Publish as a release so the APK can be downloaded straight from a phone (no zip).
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GST Reminder build ${{ github.run_number }}
          body: |
            Download **GST-Reminder.apk** below on your phone and open it to install / update.
            Commit: ${{ github.sha }}
          make_latest: true
          files: GST-Reminder.apk
