name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      # The signing key lives in GitHub Secrets (Settings > Secrets and variables > Actions):
      #   SIGNING_KEYSTORE_BASE64 = base64 of the .p12 keystore, SIGNING_PASSWORD = its password.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GST-Reminder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GST-Reminder-apk
          path: GST-Reminder.apk

      # Only builds of main become a release; the app auto-updates to the latest release.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GST Reminder build ${{ github.run_number }}
          body: |
            Download **GST-Reminder.apk** below on your phone and open it to install / update.
            Commit: ${{ github.sha }}
          make_latest: true
          files: GST-Reminder.apk
